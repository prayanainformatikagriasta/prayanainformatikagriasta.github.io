<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai Siswa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .remedial-card {
            animation: pulse-red 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-12">

    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-10 px-4 text-center shadow-lg mb-8">
        <h1 class="text-3xl font-bold tracking-wide">Pusat Informasi & Cek Nilai Siswa</h1>
        <p class="text-blue-100 mt-2">Silakan cari nilai Anda menggunakan Nama atau NIS</p>
    </div>

    <div class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-slate-800 mb-4">Cari Nilai Anda</h2>
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="Masukkan Nama atau NIS..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    <button onclick="cariNilai()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-md cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass mr-2"></i>Cari
                    </button>
                </div>
            </div>

            <div id="result-box" class="hidden bg-white p-6 rounded-2xl shadow-md border border-slate-200 transition-all">
                </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 h-fit">
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-slate-800 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-crown text-amber-500 animate-bounce"></i> Top 10 Angkatan
                </h2>
                <p class="text-xs text-slate-500">Nilai tertinggi gabungan seluruh kelas</p>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 text-xs tracking-wider uppercase">
                            <th class="py-2 text-center">Pos</th>
                            <th class="py-2">Nama</th>
                            <th class="py-2 text-right">Nilai</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="text-sm text-slate-700">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. DATA EXCEL (Ubah ke JSON di bawah ini)
        // ==========================================
        // Silakan ganti data contoh ini dengan data dari Excel Anda.
        // Anda bisa gunakan converter online "Excel to JSON".
        const dataSiswa = [
            { nis: "1001", nama: "Arya Wiguna", kelas: "8.1", nilai: 98 },
            { nis: "1002", nama: "Budi Santoso", kelas: "8.1", nilai: 70 },
            { nis: "1003", nama: "Citra Lestari", kelas: "8.1", nilai: 85 },
            { nis: "1004", nama: "Dewa Gede", kelas: "8.2", nilai: 95 },
            { nis: "1005", nama: "Eka Putri", kelas: "8.2", nilai: 73 },
            { nis: "1006", nama: "Fajar Utama", kelas: "8.2", nilai: 92 },
            { nis: "1007", nama: "Giska Amelia", kelas: "8.3", nilai: 65 },
            { nis: "1008", nama: "Hendra Wijaya", kelas: "8.3", nilai: 88 },
            { nis: "1009", nama: "Indah Permata", kelas: "8.3", nilai: 74 },
            { nis: "1010", nama: "Joko Susilo", kelas: "8.4", nilai: 98 },
            { nis: "1011", nama: "Ketut Rai", kelas: "8.4", nilai: 80 },
            { nis: "1012", nama: "Luh Sari", kelas: "8.4", nilai: 60 }
        ];

        // URL Link Remedial Anda
        const LINK_REMEDIAL = "https://forms.gle/ContohLinkRemedialAnda"; 
        const KKM = 74;

        // ==========================================
        // 2. LOGIKA UTAMA SYSTEM (PROSES DATA)
        // ==========================================
        
        // Cari nilai tertinggi di Angkatan
        const nilaiTertinggiAngkatan = Math.max(...dataSiswa.map(s => s.nilai));

        // Fungsi untuk mencari nilai tertinggi di kelas tertentu
        function dapatkanNilaiTertinggiKelas(namaKelas) {
            const siswaDiKelas = dataSiswa.filter(s => s.kelas === namaKelas);
            return Math.max(...siswaDiKelas.map(s => s.nilai));
        }

        // ==========================================
        // 3. RENDER LEADERBOARD TOP 10 ANGKATAN
        // ==========================================
        function muatLeaderboard() {
            // Urutkan berdasarkan nilai tertinggi
            const urutanSiswa = [...dataSiswa].sort((a, b) => b.nilai - a.nilai).slice(0, 10);
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            urutanSiswa.forEach((siswa, index) => {
                let mahkota = '';
                let bgRow = '';
                
                // Tambah mahkota untuk peringkat 1, 2, 3
                if (index === 0) {
                    mahkota = '<i class="fa-solid fa-crown text-amber-500 ml-1"></i>';
                    bgRow = 'bg-amber-50 font-bold';
                } else if (index === 1) {
                    mahkota = '<i class="fa-solid fa-crown text-slate-400 ml-1"></i>';
                } else if (index === 2) {
                    mahkota = '<i class="fa-solid fa-crown text-amber-700 ml-1"></i>';
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 ${bgRow} hover:bg-slate-50 transition-colors">
                        <td class="py-3 text-center font-semibold text-slate-500">${index + 1}</td>
                        <td class="py-3">${siswa.nama} ${mahkota} <span class="text-xs text-slate-400 block">${siswa.kelas}</span></td>
                        <td class="py-3 text-right font-bold text-indigo-600">${siswa.nilai}</td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // 4. FUNGSI PENCARIAN & ANIMASI
        // ==========================================
        function cariNilai() {
            const input = document.getElementById('search-input').value.toLowerCase().trim();
            const resultBox = document.getElementById('result-box');
            
            if (input === "") {
                alert("Masukkan nama atau NIS terlebih dahulu!");
                return;
            }

            // Cocokkan data berdasarkan nama atau NIS
            const hasil = dataSiswa.find(s => s.nama.toLowerCase().includes(input) || s.nis.includes(input));

            resultBox.classList.remove('hidden');

            if (!hasil) {
                resultBox.innerHTML = `
                    <div class="text-center py-6">
                        <i class="fa-solid fa-circle-xmark text-red-500 text-4xl mb-2"></i>
                        <p class="text-slate-600 font-medium">Data tidak ditemukan. Periksa kembali Nama/NIS Anda.</p>
                    </div>
                `;
                return;
            }

            const nilaiTertinggiKelas = dapatkanNilaiTertinggiKelas(hasil.kelas);
            let statusHTML = '';
            
            // --- LOGIKA ANIMASI & KONDISI ---

            // KONDISI 1: NILAI TERTINGGI ANGKATAN / KELAS
            if (hasil.nilai === nilaiTertinggiAngkatan) {
                statusHTML = `
                    <div class="bg-amber-100 border border-amber-300 text-amber-800 p-4 rounded-xl text-center font-bold mb-4 animate__animated animate__jackInTheBox">
                        👑 LUAR BIASA! ${hasil.nama} meraih nilai TERTINGGI di ANGKATAN! 👑
                    </div>
                `;
                pemicuPetasanMeriah();
            } else if (hasil.nilai === nilaiTertinggiKelas) {
                statusHTML = `
                    <div class="bg-green-100 border border-green-300 text-green-800 p-4 rounded-xl text-center font-bold mb-4 animate__animated animate__zoomInUp">
                        ⭐ SELAMAT! ${hasil.nama} meraih nilai TERTINGGI di Kelas ${hasil.kelas}! ⭐
                    </div>
                `;
                pemicuPetasanBiasa();
            }
            // KONDISI 2: DI BAWAH KKM (74)
            else if (hasil.nilai < KKM) {
                statusHTML = `
                    <div class="remedial-card bg-red-50 border-2 border-red-400 text-red-700 p-5 rounded-xl text-center mb-4 animate__animated animate__shakeX">
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
                        <p class="font-bold text-lg">Nilai ${hasil.nama} berada di bawah KKM!</p>
                        <p class="text-sm text-red-600 mt-1 mb-4">Segera lakukan remedial melalui tombol di bawah ini:</p>
                        <a href="${LINK_REMEDIAL}" target="_blank" class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition-transform hover:scale-105 active:scale-95">
                            <i class="fa-solid fa-file-pen mr-2"></i> Ikut Remedial Sekarang
                        </a>
                    </div>
                `;
            } else {
                // Kondisi Aman (Lulus KKM tetapi bukan tertinggi)
                statusHTML = `
                    <div class="bg-blue-50 border border-blue-200 text-blue-700 p-4 rounded-xl text-center font-medium mb-4">
                        Status: <span class="font-bold text-green-600">LULUS KKM</span>. Pertahankan prestasimu!
                    </div>
                `;
            }

            // Tampilkan rincian kartu nilai siswa
            resultBox.innerHTML = `
                <h3 class="text-lg font-bold text-slate-700 mb-4 pb-2 border-b border-slate-100">Hasil Pencarian</h3>
                ${statusHTML}
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="text-xs text-slate-400 block">Nama Lengkap</span>
                        <span class="font-semibold text-slate-700">${hasil.nama}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="text-xs text-slate-400 block">NIS</span>
                        <span class="font-semibold text-slate-700">${hasil.nis}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl">
                        <span class="text-xs text-slate-400 block">Kelas</span>
                        <span class="font-semibold text-slate-700">${hasil.kelas}</span>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <span class="text-xs text-indigo-400 block font-bold">Nilai Akhir</span>
                        <span class="text-2xl font-black text-indigo-700">${hasil.nilai}</span>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 5. PACK ANIMASI CONFETTI (PETASAN)
        // ==========================================
        function pemicuPetasanBiasa() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function pemicuPetasanMeriah() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        // Jalankan leaderboard saat halaman pertama kali dibuka
        window.onload = muatLeaderboard;

        // Mendukung pencarian dengan menekan tombol Enter
        document.getElementById("search-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                cariNilai();
            }
        });
    </script>
</body>
</html>
