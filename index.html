<head>

<title>ANBK Informatika</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin:0;
  background:#f0f4f8;
}

/* ===== HALAMAN AWAL ===== */
.start-screen {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.start-card {
  background:white;
  padding:30px;
  border-radius:15px;
  width:350px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.start-card input {
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* ===== LAYOUT ===== */
.container {
  display:flex;
}

.sidebar {
  width:100px;
  background:#fff;
  padding:10px;
  height:100vh;
  overflow:auto;
}

.sidebar button {
  width:40px;
  height:40px;
  margin:5px;
  border:none;
  border-radius:50%;
  background:#e0e7ff;
}

.sidebar button.active {
  background:#6366f1;
  color:white;
}

.main {
  flex:1;
  padding:30px;
}

.card {
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* ===== SOAL ===== */
.option {
  display:block;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:2px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover {
  background:#eef2ff;
}

.option input {
  margin-right:10px;
}

/* ===== TIMER ===== */
.timer {
  position:fixed;
  top:15px;
  right:20px;
  background:#111827;
  color:white;
  padding:10px 15px;
  border-radius:10px;
}

.alert {
  position:fixed;
  top:60px;
  right:20px;
  background:red;
  color:white;
  padding:10px;
  border-radius:8px;
  animation:fade 3s;
}

@keyframes fade {
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}

button {
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#6366f1;
  color:white;
  cursor:pointer;
}

.ragu {
  background:orange;
}

.locked {
  opacity:0.6;
  pointer-events:none;
}

</style>
</head>

questions = questions.sort(()=>Math.random()-0.5);

let current=0;
let answers=[];
let doubt=[];

// ===== INIT =====
function initQuiz(){
let nav=document.getElementById("nav");
questions.forEach((_,i)=>{
let b=document.createElement("button");
b.innerText=i+1;
b.onclick=()=>{current=i; render();};
nav.appendChild(b);
});
render();
startTimer();
}

// ===== RENDER =====
function render(){
let q=questions[current];

let html=`<h3>${current+1}. ${q.q}</h3>`;

q.options.forEach((o,i)=>{
html+=`
<label class="option">
<input type="radio" name="q"
${answers[current]==i?"checked":""}
onchange="selectAnswer(${i})">
${o}
</label>`;
});

document.getElementById("questionBox").innerHTML=html;
}

// ===== PILIH JAWABAN + LOCK =====
function selectAnswer(i){
answers[current]=i;

let box=document.getElementById("questionBox");
box.classList.add("locked");

setTimeout(()=>{
box.classList.remove("locked");
},10000);
}

// ===== RAGU =====
function ragu(){
doubt[current]=true;
alert("Ditandai ragu");
}

// ===== NAV =====
function next(){ if(current<questions.length-1){current++;render();}}
function prev(){ if(current>0){current--;render();}}

// ===== TIMER =====
let duration=75*60;
let startTime=Date.now();
let lastNotif=0;

function startTimer(){
setInterval(()=>{
let s=Math.floor((Date.now()-startTime)/1000);
let remain=duration-s;

let m=Math.floor(remain/60);
let sec=remain%60;

document.getElementById("timer").innerText=`⏱️ ${m}:${sec<10?"0":""}${sec}`;

// tiap 10 menit
let passed=Math.floor(s/600);
if(passed>lastNotif){
lastNotif=passed;
showAlert(`Breaking News 🚨\n${passed*10} menit telah berlalu\nSisa waktu ${m} menit`);
}

if(remain<=0) submitQuiz();

},1000);
}

// ===== ALERT =====
function showAlert(text){
let div=document.createElement("div");
div.className="alert";
div.innerText=text;
document.body.appendChild(div);

setTimeout(()=>div.remove(),3000);
}

// ===== SUBMIT =====
function submitQuiz(){
let score=0;
questions.forEach((q,i)=>{
if(answers[i]===q.answer) score++;
});

let nilai=(score/questions.length)*100;

document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=
`<h2>Nilai: ${nilai.toFixed(0)}</h2>
<p>Upload hasil ke:</p>
<a href="https://forms.gle/vXp4zsKaW8PW6vtEA" target="_blank">
Google Form</a>`;
}
