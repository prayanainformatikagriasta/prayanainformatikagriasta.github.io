{q:"Urutan data benar adalah...", options:["Byte-KB-MB","MB-KB-Byte","KB-Byte-MB","Byte-MB-KB"], answer:0, exp:pembahasan[49], kisi:"50", level:"C6", difficulty:"Sulit"}

  const pembahasan = [

// 👉 nanti kamu tinggal tambah sampai 50 soal

// ================= RANDOM =================
if (!localStorage.getItem("soal_random")) {
let shuffled = questions.sort(() => Math.random()-0.5);
localStorage.setItem("soal_random", JSON.stringify(shuffled));
}
questions = JSON.parse(localStorage.getItem("soal_random"));

// ================= STATE =================
let current = 0;
let answers = JSON.parse(localStorage.getItem("answers")) || [];

// ================= RENDER NAV =================
let nav = document.getElementById("nav");
questions.forEach((_,i)=>{
let btn = document.createElement("button");
btn.innerText = i+1;
btn.onclick=()=>{current=i; render();};
nav.appendChild(btn);
});

// ================= RENDER =================
function render(){
let q = questions[current];

document.getElementById("info").innerHTML =
`Kisi: ${q.kisi} | Level: ${q.level} | ${q.difficulty}`;

let html = `<p><b>${current+1}. ${q.q}</b></p>`;

q.options.forEach((opt,i)=>{
html += `
<label>
<input type="radio" name="q" value="${i}"
${answers[current]==i?"checked":""}
onchange="saveAnswer(${i})">
${opt}
</label><br>`;
});

document.getElementById("questionBox").innerHTML = html;
}

function saveAnswer(val){
answers[current]=val;
localStorage.setItem("answers", JSON.stringify(answers));
}

function next(){ if(current<questions.length-1){current++; render();}}
function prev(){ if(current>0){current--; render();}}

// ================= TIMER =================
let duration = 75 * 60; // 75 menit
let timerKey = "timer_start";

if (!localStorage.getItem(timerKey)) {
localStorage.setItem(timerKey, Date.now());
}

function updateTimer(){
let start = parseInt(localStorage.getItem(timerKey));
let elapsed = Math.floor((Date.now()-start)/1000);
let remaining = duration - elapsed;

if (remaining <= 0) {
submitQuiz();
return;
}

let m = Math.floor(remaining/60);
let s = remaining%60;

document.getElementById("timer").innerText =
`⏱️ ${m}:${s<10?"0":""}${s}`;

setTimeout(updateTimer,1000);
}
updateTimer();

// ================= SUBMIT =================
function submitQuiz(){
let score=0;
let resultHTML="";

questions.forEach((q,i)=>{
let user=answers[i];

if(user===q.answer){
score++;
resultHTML += `<p class="correct">${i+1}. Benar</p>`;
}else{
resultHTML += `<p class="wrong">${i+1}. Salah</p>`;
}

resultHTML += `
<p>Jawaban kamu: ${q.options[user]||"-"}</p>
<p>Jawaban benar: ${q.options[q.answer]}</p>
<p><i>${q.exp}</i></p><hr>`;
});

let nilai = (score/questions.length)*100;
localStorage.setItem("nilai", nilai);

document.getElementById("result").innerHTML =
`<h2>Nilai: ${nilai.toFixed(0)}</h2>` + resultHTML;

document.getElementById("result").classList.remove("hidden");

// disable
document.querySelectorAll("input").forEach(e=>e.disabled=true);
}

// ================= ANTI REFRESH =================
if(localStorage.getItem("nilai")){
submitQuiz();
}

// ================= START =================
render();

</script>
