<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Wheel Sederhana</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        /* Jarum Penunjuk */
        .wheel-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        button:disabled {
            background-color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinBtn">PUTAR SEKARANG!</button>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");

        const options = ["Pizza", "Burger", "Sate", "Soto", "Bakso", "Gado-gado", "Nasi Goreng", "Salad"];
        const colors = ["#f1c40f", "#e67e22", "#e74c3c", "#9b59b6", "#3498db", "#1abc9c", "#2ecc71", "#34495e"];
        
        let startAngle = 0;
        const arc = Math.PI / (options.length / 2);
        let spinTimeout = null;

        function drawWheel() {
            options.forEach((text, i) => {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i];
                
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, angle, angle + arc, false);
                ctx.lineTo(250, 250);
                ctx.fill();

                // Teks
                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(250 + Math.cos(angle + arc / 2) * 180, 250 + Math.sin(angle + arc / 2) * 180);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.font = 'bold 20px Arial';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            });
        }

        function spin() {
            spinBtn.disabled = true;
            const extraDegree = Math.floor(Math.random() * 360) + 3600; // Minimal 10 putaran
            const totalDegree = extraDegree;
            
            canvas.style.transform = `rotate(${totalDegree}deg)`;

            // Reset tombol setelah animasi selesai (4 detik)
            setTimeout(() => {
                spinBtn.disabled = false;
                // Logika untuk menentukan pemenang bisa ditambahkan di sini
            }, 4000);
        }

        spinBtn.addEventListener("click", () => {
            // Karena kita pakai CSS transition, kita hanya perlu reset rotasi jika ingin putar ulang dengan clean
            canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
            spin();
        });

        drawWheel();
    </script>
</body>
</html>
