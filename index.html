*{

body{
margin:0;

/* HEADER */

.header{
background:#1976d2;

padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
position:sticky;
top:0;
z-index:10;
}

.header h2{
font-size:17px;
margin:0;
}

.timer{
background:#0d47a1;
padding:7px 12px;
border-radius:6px;
font-weight:bold;
font-size:14px;
display:flex;
gap:6px;
align-items:center;
}

.timer.danger{
background:#c62828;
}

/* CONTAINER */

.container{
padding:15px;
max-width:750px;
margin:auto;
}

/* CARD */

.card{
background:white;
border-radius:12px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,0.12);
margin-bottom:15px;
animation:fade .3s;
}

@keyframes fade{
from{opacity:0;transform:translateY(5px)}
to{opacity:1}
}

/* TITLE */

.title{
text-align:center;
margin-bottom:15px;
}

.title h1{
margin:0;
font-size:22px;
}

/* INPUT */

input{
width:100%;
padding:14px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-top:10px;
}

/* BUTTON */

button{
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:8px;
background:#1976d2;
color:white;
margin-top:15px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
}

button:hover{
background:#0d47a1;
}

/* PROGRESS */

.progress{
font-size:14px;
margin-bottom:12px;
color:#666;
display:flex;
align-items:center;
gap:6px;
}

/* SOAL */

.soal{
font-size:18px;
font-weight:500;
margin-bottom:16px;
line-height:1.4;
}

/* OPSI */

.opsi{
display:grid;
gap:10px;
}

.opsi div{
padding:14px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
background:white;
cursor:pointer;
transition:.2s;
}

.opsi div:hover{
background:#e3f2fd;
border-color:#1976d2;
transform:scale(1.01);
}

/* FINISH SCREEN */

.block{
display:flex;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:#111;
color:white;
padding:20px;
}

.block h1{
margin-bottom:10px;
}

</style>

"D. hapus program"
]
},

{
q:"40. Next Costume digunakan untuk …",
o:[
"A. ubah background",
"B. animasi pergantian kostum",
"C. tambah suara",
"D. hapus sprite"
]
}

];

let soalAktif=[];
let nomor=0;
let waktu=3600;
let timerStart=false;

function mulai(){

let kode=document.getElementById("kode").value;

if(!kodePaket[kode]){
alert("Kode paket salah");
return;
}

soalAktif=(kodePaket[kode]=="A")?paketA:paketB;

render();

startTimer();

}

function render(){

let s=soalAktif[nomor];

document.getElementById("app").innerHTML=`

<div class="header">

<h2><i class="fa-solid fa-laptop-code"></i> Ujian Informatika</h2>

<div class="timer" id="timer">
<i class="fa-solid fa-clock"></i> 60:00
</div>

</div>

<div class="container">

<div class="card">

<div class="progress">
<i class="fa-solid fa-list"></i>
Soal ${nomor+1} / ${soalAktif.length}
</div>

<div class="soal">
${s.q}
</div>

<div class="opsi" id="opsi"></div>

<button onclick="next()">
<i class="fa-solid fa-arrow-right"></i>
Next Soal
</button>

</div>

</div>

`;

let html="";

for(let i of s.o){
html+=`<div>${i}</div>`;
}

document.getElementById("opsi").innerHTML=html;

}

function next(){

nomor++;

if(nomor>=soalAktif.length){

document.body.innerHTML=
'<div class="block"><h1>Ujian Selesai</h1><p>Silakan kumpulkan LJK</p></div>';

return;

}

render();

}

function startTimer(){

if(timerStart) return;

timerStart=true;

let t=setInterval(()=>{

let m=Math.floor(waktu/60);
let s=waktu%60;

let el=document.getElementById("timer");

if(el){

el.innerHTML=`<i class="fa-solid fa-clock"></i> ${m}:${s<10?"0"+s:s}`;

if(waktu<300){
el.classList.add("danger");
}

}

waktu--;

if(waktu<0){

clearInterval(t);

document.body.innerHTML=
'<div class="block"><h1>⏰ Waktu Habis</h1></div>';

}

},1000);

}

/* BLOCK INSPECT */

document.addEventListener("contextmenu",e=>e.preventDefault());

document.onkeydown=function(e){

if(e.keyCode==123)return false;

if(e.ctrlKey && e.shiftKey && e.keyCode==73)return false;

};

setInterval(function(){

if(
window.outerWidth-window.innerWidth>160 ||
window.outerHeight-window.innerHeight>160
){

document.body.innerHTML=
'<div class="block"><h1>⚠ Device Diblokir</h1><p>Inspect terdeteksi</p></div>';

}

},1000);

</script>
