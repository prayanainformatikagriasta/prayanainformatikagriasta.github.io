<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Family 100 - Informatika</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top,#163d78 0%,#07162f 45%,#020817 100%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.hidden{
    display:none !important;
}

/* ================= START SCREEN ================= */

.start-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.start-card{
    width:min(900px,100%);
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.15);
    border-radius:30px;
    padding:40px;
    text-align:center;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
}

.logo{
    font-size:clamp(40px,7vw,80px);
    font-weight:1000;
    color:#ffd83d;
    text-shadow:
        0 4px 0 #c47c00,
        0 8px 20px rgba(0,0,0,.6);
    letter-spacing:-3px;
}

.logo span{
    color:#fff;
}

.subtitle{
    font-size:22px;
    margin-top:8px;
    color:#a9d8ff;
    font-weight:bold;
}

.informatika{
    display:inline-block;
    margin-top:12px;
    padding:8px 18px;
    border-radius:30px;
    background:#e91e63;
    font-weight:bold;
}

.team-inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:35px;
}

.input-box{
    text-align:left;
}

.input-box label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#c9e6ff;
}

.input-box input{
    width:100%;
    padding:17px;
    border-radius:14px;
    border:2px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25);
    color:white;
    font-size:18px;
    outline:none;
}

.input-box input:focus{
    border-color:#ffd83d;
}

.start-btn{
    margin-top:30px;
    padding:18px 45px;
    border:0;
    border-radius:50px;
    background:linear-gradient(135deg,#ffd83d,#ff9f00);
    color:#421d00;
    font-size:22px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(255,170,0,.35);
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-3px) scale(1.02);
}

/* ================= GAME ================= */

.game{
    min-height:100vh;
    padding:15px;
}

.topbar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:15px;
    max-width:1400px;
    margin:auto;
}

.team-score{
    padding:15px 20px;
    border-radius:18px;
    background:linear-gradient(135deg,#0d5cff,#183a91);
    border:2px solid rgba(255,255,255,.2);
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.team-score.team2{
    background:linear-gradient(135deg,#e91e63,#8b1645);
    text-align:right;
}

.team-name{
    font-size:clamp(15px,2vw,23px);
    font-weight:bold;
}

.score{
    font-size:clamp(35px,5vw,55px);
    font-weight:1000;
    color:#ffd83d;
}

.center-logo{
    text-align:center;
}

.center-logo .small-logo{
    font-size:25px;
    font-weight:1000;
    color:#ffd83d;
}

.center-logo small{
    display:block;
    color:#a9d8ff;
}

/* ROUND */

.round-info{
    max-width:1000px;
    margin:15px auto;
    text-align:center;
}

.round-label{
    font-size:18px;
    color:#9acbff;
    font-weight:bold;
}

.category{
    display:inline-block;
    margin-top:6px;
    padding:8px 18px;
    background:#e91e63;
    border-radius:30px;
    font-weight:bold;
}

/* QUESTION */

.question-box{
    max-width:1050px;
    margin:15px auto;
    padding:28px;
    border-radius:25px;
    background:linear-gradient(135deg,#0b3d91,#061b46);
    border:2px solid rgba(255,255,255,.18);
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.question{
    font-size:clamp(24px,4vw,45px);
    font-weight:1000;
    line-height:1.2;
}

.question-number{
    color:#ffd83d;
    margin-bottom:10px;
}

/* ANSWERS */

.answers{
    max-width:1050px;
    margin:20px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer-card{
    min-height:90px;
    border-radius:18px;
    border:3px solid #3974ca;
    background:linear-gradient(135deg,#123d83,#09234f);
    display:flex;
    align-items:center;
    padding:15px;
    cursor:pointer;
    transition:.2s;
    overflow:hidden;
}

.answer-card:hover{
    transform:scale(1.02);
    border-color:#ffd83d;
}

.answer-card.open{
    background:linear-gradient(135deg,#ffd83d,#ff9d00);
    color:#321b00;
    border-color:#fff1a0;
}

.answer-card.wrong{
    background:#8d102c;
    border-color:#ff5479;
}

.answer-card .number{
    width:48px;
    height:48px;
    flex:none;
    border-radius:50%;
    background:#0a1d40;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    margin-right:14px;
}

.answer-card.open .number{
    background:#7d4b00;
    color:white;
}

.answer-text{
    flex:1;
}

.answer-main{
    font-size:clamp(18px,2.5vw,28px);
    font-weight:1000;
}

.answer-score{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

/* CONTROLS */

.controls{
    max-width:1050px;
    margin:20px auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.btn{
    border:0;
    padding:14px 22px;
    border-radius:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-blue{
    background:#1769e0;
}

.btn-yellow{
    background:#ffb300;
    color:#382000;
}

.btn-red{
    background:#d91f45;
}

.btn-green{
    background:#0ca678;
}

.btn-dark{
    background:#26344d;
}

/* STRIKES */

.strikes{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:15px;
}

.strike{
    width:55px;
    height:55px;
    border-radius:12px;
    background:#17253c;
    border:2px solid #4b6387;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:1000;
}

.strike.active{
    background:#d91f45;
    border-color:#ff7b94;
    animation:shake .4s;
}

/* TIMER */

.timer-wrap{
    max-width:400px;
    margin:15px auto;
}

.timer{
    text-align:center;
    font-size:42px;
    font-weight:1000;
    color:#5ee7ff;
}

.timer.danger{
    color:#ff466c;
    animation:pulse .5s infinite alternate;
}

.progress{
    height:10px;
    background:#1a2941;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

.progress-bar{
    height:100%;
    width:100%;
    background:#36d399;
    transition:width 1s linear;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
}

.overlay-card{
    width:min(700px,90%);
    text-align:center;
    padding:50px;
    border-radius:30px;
    background:linear-gradient(135deg,#0c367d,#071a3c);
    border:3px solid #ffd83d;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.overlay-title{
    font-size:clamp(40px,8vw,80px);
    font-weight:1000;
    color:#ffd83d;
}

.overlay-message{
    margin-top:15px;
    font-size:24px;
}

.rebutan{
    color:#ffdf46;
    font-size:20px;
    font-weight:bold;
    margin-top:20px;
}

/* FINAL */

.final-card{
    max-width:900px;
    width:90%;
    margin:auto;
    padding:35px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    text-align:center;
}

.final-title{
    font-size:clamp(40px,7vw,70px);
    color:#ffd83d;
    font-weight:1000;
}

.final-scores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin:30px 0;
}

.final-team{
    padding:25px;
    border-radius:20px;
    background:#0c3270;
}

.final-team:nth-child(2){
    background:#7b1745;
}

.final-team h2{
    font-size:25px;
}

.final-team .big{
    font-size:65px;
    font-weight:1000;
    color:#ffd83d;
    margin-top:10px;
}

.winner{
    margin-top:20px;
    font-size:32px;
    font-weight:1000;
    color:#5ee7ff;
}

/* ANIMATIONS */

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    75%{transform:translateX(10px)}
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

@keyframes pop{
    0%{transform:scale(.5);opacity:0}
    70%{transform:scale(1.1)}
    100%{transform:scale(1);opacity:1}
}

.pop{
    animation:pop .35s ease;
}

/* MOBILE */

@media(max-width:700px){

    .start-card{
        padding:25px 18px;
    }

    .team-inputs{
        grid-template-columns:1fr;
    }

    .topbar{
        grid-template-columns:1fr 1fr;
    }

    .center-logo{
        display:none;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .question-box{
        padding:20px 15px;
    }

    .score{
        font-size:38px;
    }

    .team-score{
        padding:12px;
    }

    .final-scores{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- ================= START SCREEN ================= -->

<section id="startScreen" class="start-screen">

    <div class="start-card">

        <div class="logo">
            SUPER <span>FAMILY</span> 100
        </div>

        <div class="subtitle">
            🎮 INFORMATIKA EDITION
        </div>

        <div class="informatika">
            SISTEM BILANGAN • KELAS VIII SMP
        </div>

        <div class="team-inputs">

            <div class="input-box">
                <label>🔵 Nama Tim 1</label>
                <input
                    id="team1Input"
                    type="text"
                    placeholder="Contoh: Tim Biner"
                    maxlength="25"
                >
            </div>

            <div class="input-box">
                <label>🔴 Nama Tim 2</label>
                <input
                    id="team2Input"
                    type="text"
                    placeholder="Contoh: Tim Heksadesimal"
                    maxlength="25"
                >
            </div>

        </div>

        <button class="start-btn" onclick="startGame()">
            🚀 MULAI PERMAINAN
        </button>

        <p style="margin-top:20px;color:#8faecc;font-size:14px">
            6 jenis konversi sistem bilangan • Soal otomatis • Rebutan • Strike
        </p>

    </div>

</section>


<!-- ================= GAME ================= -->

<section id="gameScreen" class="game hidden">

    <div class="topbar">

        <div class="team-score">

            <div class="team-name" id="team1Name">
                TIM 1
            </div>

            <div class="score" id="score1">
                0
            </div>

        </div>


        <div class="center-logo">

            <div class="small-logo">
                SUPER FAMILY 100
            </div>

            <small>
                INFORMATIKA
            </small>

        </div>


        <div class="team-score team2">

            <div class="team-name" id="team2Name">
                TIM 2
            </div>

            <div class="score" id="score2">
                0
            </div>

        </div>

    </div>


    <div class="round-info">

        <div class="round-label" id="roundLabel">
            SOAL 1
        </div>

        <div class="category" id="category">
            DESIMAL → BINER
        </div>

    </div>


    <div class="timer-wrap">

        <div class="timer" id="timer">
            20
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

    </div>


    <div class="question-box">

        <div class="question-number">
            PERTANYAAN
        </div>

        <div
            class="question"
            id="question">
        </div>

    </div>


    <div
        class="strikes"
        id="strikes">

        <div class="strike">X</div>
        <div class="strike">X</div>
        <div class="strike">X</div>

    </div>


    <div
        class="answers"
        id="answers">
    </div>


    <div class="controls">

        <button
            class="btn btn-yellow"
            onclick="addStrike()">
            ❌ STRIKE
        </button>

        <button
            class="btn btn-green"
            onclick="revealAll()">
            👁️ BUKA SEMUA
        </button>

        <button
            class="btn btn-blue"
            onclick="rebutan()">
            🔥 REBUTAN
        </button>

        <button
            class="btn btn-dark"
            onclick="toggleFullscreen()">
            ⛶ FULLSCREEN
        </button>

        <button
            class="btn btn-red"
            onclick="nextQuestion()">
            ➡️ SOAL BERIKUTNYA
        </button>

        <button
            class="btn btn-dark"
            onclick="showFinal()">
            🏆 AKHIRI GAME
        </button>

    </div>

</section>


<!-- ================= OVERLAY ================= -->

<div
    id="overlay"
    class="overlay hidden">

    <div class="overlay-card">

        <div
            class="overlay-title"
            id="overlayTitle">
            STRIKE!
        </div>

        <div
            class="overlay-message"
            id="overlayMessage">
        </div>

        <div
            class="rebutan"
            id="overlaySub">
        </div>

        <button
            class="start-btn"
            onclick="closeOverlay()">
            LANJUT
        </button>

    </div>

</div>


<!-- ================= FINAL ================= -->

<section
    id="finalScreen"
    class="start-screen hidden">

    <div class="final-card">

        <div class="final-title">
            🏆 FINAL SCORE
        </div>

        <div class="final-scores">

            <div class="final-team">

                <h2 id="finalTeam1">
                    TIM 1
                </h2>

                <div
                    class="big"
                    id="finalScore1">
                    0
                </div>

            </div>


            <div class="final-team">

                <h2 id="finalTeam2">
                    TIM 2
                </h2>

                <div
                    class="big"
                    id="finalScore2">
                    0
                </div>

            </div>

        </div>

        <div
            class="winner"
            id="winner">
        </div>

        <button
            class="start-btn"
            onclick="location.reload()">
            🔄 MAIN LAGI
        </button>

    </div>

</section>


<script>

/* =========================================================
   DATA GAME
========================================================= */

const questionBank = [

    {
        category:"DESIMAL → BINER",
        generate: function(){

            const n = randomInt(10,63);

            return {
                question:`Ubahlah bilangan desimal <b>${n}</b> ke dalam bentuk biner!`,
                answers:[
                    {
                        text:n.toString(2),
                        score:40
                    }
                ]
            };

        }
    },

    {
        category:"BINER → DESIMAL",
        generate:function(){

            const n = randomInt(10,63);
            const binary=n.toString(2);

            return {
                question:`Ubahlah bilangan biner <b>${binary}</b> ke dalam bentuk desimal!`,
                answers:[
                    {
                        text:String(n),
                        score:40
                    }
                ]
            };

        }
    },

    {
        category:"DESIMAL → OKTAL",
        generate:function(){

            const n=randomInt(10,100);

            return {
                question:`Ubahlah bilangan desimal <b>${n}</b> ke dalam bentuk oktal!`,
                answers:[
                    {
                        text:n.toString(8),
                        score:40
                    }
                ]
            };

        }
    },

    {
        category:"OKTAL → DESIMAL",
        generate:function(){

            const n=randomInt(10,77);
            const oktal=n.toString(8);

            return {
                question:`Ubahlah bilangan oktal <b>${oktal}</b> ke dalam bentuk desimal!`,
                answers:[
                    {
                        text:String(n),
                        score:40
                    }
                ]
            };

        }
    },

    {
        category:"DESIMAL → HEKSADESIMAL",
        generate:function(){

            const n=randomInt(10,255);

            return {
                question:`Ubahlah bilangan desimal <b>${n}</b> ke dalam bentuk heksadesimal!`,
                answers:[
                    {
                        text:n.toString(16).toUpperCase(),
                        score:40
                    }
                ]
            };

        }
    },

    {
        category:"HEKSADESIMAL → DESIMAL",
        generate:function(){

            const n=randomInt(10,255);
            const hex=n.toString(16).toUpperCase();

            return {
                question:`Ubahlah bilangan heksadesimal <b>${hex}</b> ke dalam bentuk desimal!`,
                answers:[
                    {
                        text:String(n),
                        score:40
                    }
                ]
            };

        }
    }

];


/* =========================================================
   STATE
========================================================= */

let team1="";
let team2="";

let score1=0;
let score2=0;

let currentTeam=1;

let questionNumber=0;

let currentQuestion=null;

let strikes=0;

let timer=20;

let timerInterval=null;

let gameOver=false;


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    team1=document
        .getElementById("team1Input")
        .value
        .trim() || "TIM BIRU";

    team2=document
        .getElementById("team2Input")
        .value
        .trim() || "TIM MERAH";


    document.getElementById("team1Name").textContent=team1;
    document.getElementById("team2Name").textContent=team2;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    nextQuestion();

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    clearInterval(timerInterval);

    strikes=0;

    updateStrikes();

    questionNumber++;

    const template =
        questionBank[
            randomInt(0,questionBank.length-1)
        ];

    currentQuestion=template.generate();

    document.getElementById("roundLabel").textContent=
        `SOAL ${questionNumber}`;

    document.getElementById("category").textContent=
        template.category;

    document.getElementById("question").innerHTML=
        currentQuestion.question;

    createAnswers();

    startTimer();

}


/* =========================================================
   CREATE ANSWERS
========================================================= */

function createAnswers(){

    const container=
        document.getElementById("answers");

    container.innerHTML="";


    /*
       Kita buat 5 kartu jawaban.
       Hanya 1 yang benar.
       Kartu lainnya berisi jawaban pengecoh.
    */

    const correct=
        currentQuestion.answers[0];

    let answerList=[
        correct.text
    ];


    while(answerList.length<5){

        let fake;

        const category=
            document.getElementById("category").textContent;

        if(category==="DESIMAL → BINER"){

            fake=randomInt(8,63).toString(2);

        }else if(category==="BINER → DESIMAL"){

            fake=String(randomInt(8,63));

        }else if(category==="DESIMAL → OKTAL"){

            fake=randomInt(8,100).toString(8);

        }else if(category==="OKTAL → DESIMAL"){

            fake=String(randomInt(8,100));

        }else if(category==="DESIMAL → HEKSADESIMAL"){

            fake=randomInt(8,255)
                .toString(16)
                .toUpperCase();

        }else{

            fake=String(randomInt(8,255));

        }

        if(
            !answerList.includes(fake) &&
            fake!==correct.text
        ){
            answerList.push(fake);
        }

    }


    answerList=shuffle(answerList);


    answerList.forEach((answer,index)=>{

        const card=
            document.createElement("div");

        card.className="answer-card";

        card.dataset.answer=answer;

        const isCorrect=
            answer===correct.text;

        card.dataset.correct=isCorrect;


        card.innerHTML=`

            <div class="number">
                ${index+1}
            </div>

            <div class="answer-text">

                <div class="answer-main">
                    ?
                </div>

                <div class="answer-score">
                    ${isCorrect ? "40 POIN" : "—"}
                </div>

            </div>
        `;


        card.onclick=()=>{
            openAnswer(card);
        };


        container.appendChild(card);

    });

}


/* =========================================================
   OPEN ANSWER
========================================================= */

function openAnswer(card){

    if(card.classList.contains("open"))
        return;


    card.classList.add("open");
    card.classList.add("pop");


    const answer=
        card.dataset.answer;

    const main=
        card.querySelector(".answer-main");

    main.textContent=answer;


    if(card.dataset.correct==="true"){

        addScore(
            currentTeam,
            40
        );

        showMessage(
            "🎉 BENAR!",
            `${teamName(currentTeam)} mendapatkan 40 poin!`,
            "Jawaban yang benar!"
        );

    }else{

        card.classList.add("wrong");

        addStrike();

    }

}


/* =========================================================
   SCORE
========================================================= */

function addScore(team,points){

    if(team===1){

        score1+=points;

        document.getElementById("score1")
            .textContent=score1;

    }else{

        score2+=points;

        document.getElementById("score2")
            .textContent=score2;

    }

}


/* =========================================================
   STRIKE
========================================================= */

function addStrike(){

    if(strikes>=3)
        return;

    strikes++;

    updateStrikes();

    showMessage(
        "❌ STRIKE!",
        `${teamName(currentTeam)} mendapatkan strike ke-${strikes}!`,
        strikes===3
            ? "Kesempatan REBUTAN!"
            : "Hati-hati, jangan sampai 3 strike!"
    );


    if(strikes===3){

        clearInterval(timerInterval);

        setTimeout(()=>{
            closeOverlay();
            rebutan();
        },1000);

    }

}


/* =========================================================
   UPDATE STRIKE
========================================================= */

function updateStrikes(){

    const items=
        document.querySelectorAll(".strike");

    items.forEach((item,index)=>{

        if(index<strikes)
            item.classList.add("active");
        else
            item.classList.remove("active");

    });

}


/* =========================================================
   REBUTAN
========================================================= */

function rebutan(){

    const otherTeam=
        currentTeam===1 ? 2 : 1;

    currentTeam=otherTeam;

    strikes=0;

    updateStrikes();

    showMessage(
        "🔥 REBUTAN!",
        `${teamName(currentTeam)}, kesempatan mengambil poin!`,
        "Jawab dengan cepat!"
    );

    startTimer();

}


/* =========================================================
   REVEAL ALL
========================================================= */

function revealAll(){

    document
        .querySelectorAll(".answer-card")
        .forEach(card=>{

            const main=
                card.querySelector(".answer-main");

            main.textContent=
                card.dataset.answer;

            card.classList.add("open");

        });

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(timerInterval);

    timer=20;

    updateTimer();

    timerInterval=
        setInterval(()=>{

            timer--;

            updateTimer();

            if(timer<=0){

                clearInterval(timerInterval);

                showMessage(
                    "⏰ WAKTU HABIS!",
                    "Waktu menjawab telah berakhir.",
                    "Guru dapat melanjutkan ke soal berikutnya."
                );

            }

        },1000);

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer(){

    const timerEl=
        document.getElementById("timer");

    const bar=
        document.getElementById("progressBar");

    timerEl.textContent=timer;

    bar.style.width=
        `${(timer/20)*100}%`;


    if(timer<=5)
        timerEl.classList.add("danger");
    else
        timerEl.classList.remove("danger");

}


/* =========================================================
   OVERLAY
========================================================= */

function showMessage(title,message,sub){

    document
        .getElementById("overlayTitle")
        .textContent=title;

    document
        .getElementById("overlayMessage")
        .textContent=message;

    document
        .getElementById("overlaySub")
        .textContent=sub;

    document
        .getElementById("overlay")
        .classList.remove("hidden");

}


function closeOverlay(){

    document
        .getElementById("overlay")
        .classList.add("hidden");

}


/* =========================================================
   FINAL
========================================================= */

function showFinal(){

    clearInterval(timerInterval);

    document
        .getElementById("gameScreen")
        .classList.add("hidden");

    document
        .getElementById("finalScreen")
        .classList.remove("hidden");


    document
        .getElementById("finalTeam1")
        .textContent=team1;

    document
        .getElementById("finalTeam2")
        .textContent=team2;

    document
        .getElementById("finalScore1")
        .textContent=score1;

    document
        .getElementById("finalScore2")
        .textContent=score2;


    let winner="";

    if(score1>score2){

        winner=
            `🏆 PEMENANG: ${team1}!`;

    }else if(score2>score1){

        winner=
            `🏆 PEMENANG: ${team2}!`;

    }else{

        winner=
            `🤝 HASILNYA SERI!`;

    }


    document
        .getElementById("winner")
        .textContent=winner;

}


/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

}


/* =========================================================
   UTILITIES
========================================================= */

function teamName(team){

    return team===1 ? team1 : team2;

}


function randomInt(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}


function shuffle(array){

    return array
        .map(value=>({
            value,
            sort:Math.random()
        }))
        .sort((a,b)=>a.sort-b.sort)
        .map(obj=>obj.value);

}

</script>
